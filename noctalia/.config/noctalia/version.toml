# Versión "hud" (inspirada en "Ghost in the Shell for HyDE" y en "Nyx").
# Paneles de datos flotando sobre el fondo, fuente monoespaciada, cian/violeta con acento rojo.
# Noctalia carga todos los *.toml de esta carpeta por orden alfabético: este archivo se aplica
# después de config.toml y sobrescribe lo que repite.
#
# Las "imágenes flotando" son widgets sticker: pon tus imágenes o GIF en ~/Pictures/stickers/ y
# cambia image_path (abajo) o usa el editor: noctalia msg desktop-widgets-edit (Esc para salir).

[theme]
mode           = "dark"
source         = "custom"
custom_palette = "Hud"            # palettes/Hud.json

[shell]
font_family = "MesloLGM Nerd Font Mono"

[location]
auto_locate = false
address     = "San Vicente del Raspeig, Alicante, España"

[weather]
enabled = true
unit    = "metric"

[wallpaper]
fill_mode = "crop"

    [wallpaper.default]
    path = "/home/pedro/dev/projects/personal/dotfiles/assets/hud/fondo-provisional.jpg"

# Barra fina, recta y a todo lo ancho, como la de un terminal
[bar.default]
position             = "top"
thickness            = 30
margin_ends          = 0
margin_edge          = 0
concave_edge_corners = false
radius               = 0
radius_top_left      = 0
radius_top_right     = 0
radius_bottom_left   = 0
radius_bottom_right  = 0
background_opacity   = 0.88
capsule              = false
start                = [ "workspaces", "active_window" ]
center               = [ "clock" ]
end                  = [ "media", "notifications", "network", "bluetooth", "volume", "battery", "session" ]

[widget.clock]
format = "{:%H:%M:%S  //  %Y.%m.%d}"
color  = "primary"

# ---------------------------------------------------------------------------------------------
# Widgets del escritorio. cx/cy = centro del widget en píxeles de esa pantalla.
# HDMI-A-1 = Samsung (2560x1440). eDP-1 = portátil (1920x1080).
# ---------------------------------------------------------------------------------------------
[desktop_widgets]
enabled        = true
schema_version = 2
widget_order   = [
    "reloj_s", "calendario_s", "visual_s", "musica_s", "tiempo_s", "red_s",
    "cpu_s", "ram_s", "nota_s", "sticker_s",
    "reloj_l", "tiempo_l", "musica_l", "cpu_l", "sticker_l",
]

# --- Samsung: columna A ----------------------------------------------------------------------
[desktop_widgets.widget.reloj_s]
type = "clock"
output = "HDMI-A-1"
cx = 230.0
cy = 140.0
box_width = 380.0
box_height = 150.0
    [desktop_widgets.widget.reloj_s.settings]
    clock_style = "digital"
    format = "{:%H:%M}"
    center_text = true
    color = "primary"
    background_color = "surface"
    background_opacity = 0.78
    background_radius = 4.0

[desktop_widgets.widget.calendario_s]
type = "calendar"
output = "HDMI-A-1"
cx = 230.0
cy = 410.0
box_width = 380.0
box_height = 320.0
    [desktop_widgets.widget.calendario_s.settings]
    show_events = false
    background_color = "surface"
    background_opacity = 0.78
    background_radius = 4.0

[desktop_widgets.widget.visual_s]
type = "audio_visualizer"
output = "HDMI-A-1"
cx = 230.0
cy = 700.0
box_width = 380.0
box_height = 200.0
    [desktop_widgets.widget.visual_s.settings]
    bands = 48
    mirrored = false
    centered = false
    show_when_idle = true
    color_1 = "primary"
    color_2 = "secondary"
    background = true
    background_color = "surface"
    background_opacity = 0.78
    background_radius = 4.0

