# Versión "marco" (inspirada en CachyOS + Noctalia "Sidebar Frame" y en los colores de Cinnamon).
# Noctalia carga todos los *.toml de esta carpeta por orden alfabético: este archivo se aplica
# después de config.toml y sobrescribe lo que repite.
#
# El marco de la izquierda (con el pico) es una imagen (sticker) en assets/marco/, y Hyprland
# reserva ese espacio (reserved_area en hypr/config/monitors.lua) para que las ventanas no lo tapen.
# Para mover/redimensionar widgets a mano: noctalia msg desktop-widgets-edit (Esc para salir).

[theme]
mode           = "dark"
source         = "custom"
custom_palette = "Marco"          # palettes/Marco.json

[shell]
font_family = "Noto Sans"

[location]
auto_locate = false
address     = "San Vicente del Raspeig, Alicante, España"

[weather]
enabled = true
unit    = "metric"

[wallpaper]
fill_mode = "crop"

    [wallpaper.default]
    path = "/home/pedro/dev/projects/personal/dotfiles/assets/marco/fondo-provisional.jpg"

# Barra superior a todo lo ancho, pegada al borde, con las esquinas de abajo hacia dentro
[bar.default]
position             = "top"
thickness            = 40
margin_ends          = 0
margin_edge          = 0
concave_edge_corners = true
radius_top_left      = 0
radius_top_right     = 0
radius_bottom_left   = 16
radius_bottom_right  = 16
background_opacity   = 1.0
capsule              = true
capsule_fill         = "surface_variant"
start                = [ "launcher", "workspaces" ]
center               = [ "active_window" ]
end                  = [ "media", "tray", "notifications", "network", "bluetooth", "volume", "battery", "clock", "session" ]

[widget.clock]
format = "{:%H:%M  %a %d/%m}"

# ---------------------------------------------------------------------------------------------
# Widgets del escritorio. cx/cy = centro del widget en píxeles de esa pantalla.
# HDMI-A-1 = Samsung (2560x1440, columna de 320 px). eDP-1 = portátil (1920x1080, columna de 260 px).
# Los stickers del marco van primero para quedar debajo del resto.
# ---------------------------------------------------------------------------------------------
[desktop_widgets]
enabled        = true
schema_version = 2
widget_order   = [
    "marco_s", "linea_s", "reloj_s", "tiempo_s", "calendario_s", "sistema_s", "musica_s",
    "marco_l", "linea_l", "reloj_l", "tiempo_l", "calendario_l", "musica_l",
]

