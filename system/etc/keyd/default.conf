# keyd: Alt izquierdo + ← = Inicio, Alt izquierdo + → = Fin
# Solo para el YUNZII AL80 (el teclado del portátil ya tiene Inicio/Fin)
# IDs: 28e9:30af = AL80 por cable, 28e9:2000 = AL80 por Bluetooth
# (keyd no admite comentarios al final de una línea)
[ids]
28e9:30af
28e9:2000

[main]
leftalt = layer(altnav)

# Capa que actúa como Alt para todo lo demás (Alt+Tab, Alt+F4...),
# salvo las flechas izquierda/derecha, que pasan a ser Inicio/Fin
[altnav:A]
left = home
right = end
